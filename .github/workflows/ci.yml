name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Formatting, Clippy, and tests (debcargo ${{ matrix.debcargo }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        debcargo: ['2.8.2', '2.8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts ubuntu-dev-tools quilt pkg-config libssl-dev
          cargo install debcargo --version ${{ matrix.debcargo }} --locked

      - name: Check Clippy lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features
