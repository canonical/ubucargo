[package]
name = "ubucargo"
version = "0.1.11"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/canonical/ubucargo"
description = "Create and maintain Ubuntu packages for Rust crates"

[dependencies]
anyhow = "1"
pathdiff = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
tempfile = "3"
toml_edit = "0.25"
debian-changelog = { version = "0.2", default-features = false }
debian-control = { version = "0.3.17", default-features = false, features = ["lossless"] }
deb822-fast = "0.2"
debversion = "0.5"
indoc = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }

[dev-dependencies]
similar-asserts = "1.7"
